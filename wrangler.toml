name = "no-fight-app"
compatibility_date = "2024-09-23"
pages_build_output_dir = "client"

# Биндинг базы данных D1. database_id появится после команды
# `wrangler d1 create no-fight-db` — впишите его сюда (см. README → Деплой).
[[d1_databases]]
binding = "DB"
database_name = "no-fight-db"
database_id = "PASTE_DATABASE_ID_HERE"

# Переменные окружения. BOT_TOKEN сюда НЕ кладём — это секрет, его задаём
# отдельной командой `wrangler pages secret put BOT_TOKEN`, чтобы он не
# попал в git и в Cloudflare dashboard как обычный текст.
[vars]
SKIP_TELEGRAM_AUTH = "true"
